name: smart-library-management

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_library_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smart_library
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_library"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
